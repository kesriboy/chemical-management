name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: 核心逻辑测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 运行核心业务逻辑测试
        run: node test/core.test.js

  dom-test:
    name: DOM 集成测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 jsdom
        run: npm install --no-save --no-package-lock jsdom

      - name: 运行 DOM 集成测试
        run: node test/dom.test.js
